name: Live data sources

# The skills point at free public sources (MLB Stats API, nflverse, sportsdataverse)
# and the Blaze Sports Intel MCP server.
# This job catches the day one of them moves or changes shape.
on:
  schedule:
    - cron: "17 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    name: Skill scripts against live sources
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SPORTS_LIVE: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run tests with live downloads
        run: |
          failed=0
          for t in plugins/*/skills/*/tests; do
            echo "== $t"
            python -m unittest discover -s "$t" -v || failed=1
          done
          exit $failed

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Blaze MCP serves its documented tools
        run: node --test tests/blaze-mcp.test.mjs
