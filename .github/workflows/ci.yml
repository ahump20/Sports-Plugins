name: CI — Validate & Test

on:
  push:
    branches: [main, "copilot/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck · Validate · Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck TypeScript sources
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Validate plugin structure
        run: node scripts/validate-plugins.mjs

      - name: Setup Python for archive checks
        uses: actions/setup-python@v7
        with:
          python-version: "3.9"

      - name: Run unit tests
        run: node --test tests/*.test.mjs

      - name: Run Vitest suites
        run: npm run test:vitest

      - name: Build standalone plugin packages
        run: |
          mkdir -p dist/plugin-packages
          python3 scripts/package-plugins.py --output dist/plugin-packages > dist/plugin-packages/checksums.json

      - name: Save standalone plugin packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sports-plugin-packages
          path: dist/plugin-packages/
          if-no-files-found: error
          retention-days: 7

      - name: Verify JSON files are valid
        run: |
          find . -name "*.json" -not -path "./.git/*" -not -path "./node_modules/*" | while read f; do
            echo "Checking $f"
            node -e "JSON.parse(require('fs').readFileSync('$f','utf-8'))" || exit 1
          done

  skills:
    name: Skill scripts · plugin validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.9"

      - name: Test source-backed calculations and synthetic workflow edge cases
        run: |
          set -e
          for t in plugins/*/skills/*/tests; do
            echo "== $t"
            python -m unittest discover -s "$t" -v
          done

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: claude plugin validate
        run: npx -y @anthropic-ai/claude-code plugin validate .
